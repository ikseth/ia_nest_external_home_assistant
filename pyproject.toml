[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ianest-external-ha"
version = "0.1.0"
description = "Closed Home Assistant MCP catalog for IA_NEST"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.20",
  "mcp>=1.28.1,<2",
  "starlette>=0.27",
  "uvicorn>=0.31.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
ianest-external-ha = "ianest_external_ha.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
